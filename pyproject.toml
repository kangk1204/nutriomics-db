[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrigenomics-research-db"
version = "0.1.0"
description = "Local research database for food composition and human nutrigenomics evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<4",
  "pyarrow>=19,<30",
  "duckdb>=1.3,<2",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "streamlit>=1.49,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]
figures = ["matplotlib==3.10.7"]

[tool.setuptools.packages.find]
include = ["nutrigenomics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

