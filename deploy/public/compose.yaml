services:
  nutriomics:
    build:
      context: ../..
      dockerfile: deploy/public/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "${PUBLIC_RELEASE:?Choose a reviewed public release}:/dataset:ro"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 4
