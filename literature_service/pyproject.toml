[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriomics-literature"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.49,<2", "plotly>=6,<7", "requests>=2.32,<3", "defusedxml>=0.7,<1", "supervisor>=4.2,<5", "psutil>=6,<8", "tzdata>=2025.1"]

[project.optional-dependencies]
chatgpt = ["PyJWT[crypto]==2.10.1", "cryptography==46.0.7"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "ijson==3.6.0"]
nlp = ["numpy==1.26.4", "spacy==3.7.5", "scispacy==0.6.2", "weasel==0.3.4", "typer==0.9.0", "click==8.1.7", "en-core-sci-sm @ https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz"]

[project.scripts]
nutri-literature = "nutri_literature.cli:main"
nutri-literature-v6 = "nutri_literature.cli_v6:main"
nutri-literature-chatgpt = "nutri_literature.cli_chatgpt:main"

[tool.setuptools.packages.find]
include = ["nutri_literature*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
