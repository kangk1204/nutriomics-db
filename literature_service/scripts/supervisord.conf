[unix_http_server]
file=%(ENV_LITERATURE_HOME)s/supervisor.sock
chmod=0600

[supervisord]
logfile=%(ENV_LITERATURE_HOME)s/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(ENV_LITERATURE_HOME)s/supervisord.pid
childlogdir=%(ENV_LITERATURE_HOME)s/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_LITERATURE_HOME)s/supervisor.sock

[program:literature_api]
directory=/home/keunsoo/projects/nutriomics-literature
command=/home/keunsoo/projects/nutriomics-literature/.venv/bin/python -m uvicorn nutri_literature.api:app --host 127.0.0.1 --port 8010
environment=OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LITERATURE_HOME)s/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:literature_ui]
directory=/home/keunsoo/projects/nutriomics-literature
command=/home/keunsoo/projects/nutriomics-literature/.venv/bin/python -m streamlit run ui/app.py --server.address 127.0.0.1 --server.port 8510 --server.headless true --browser.gatherUsageStats false
environment=LITERATURE_API_URL="http://127.0.0.1:8010",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LITERATURE_HOME)s/logs/ui.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:source_oa]
directory=/home/keunsoo/projects/nutriomics-literature
command=/usr/bin/nice -n 10 /home/keunsoo/projects/nutriomics-literature/.venv/bin/python -m nutri_literature.cli worker --stage oa
environment=OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LITERATURE_HOME)s/logs/worker-oa.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:source_extract]
directory=/home/keunsoo/projects/nutriomics-literature
command=/usr/bin/nice -n 10 /home/keunsoo/projects/nutriomics-literature/.venv-v2/bin/python -m nutri_literature.cli worker --stage extract --engine heuristic-v2
environment=OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1"
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LITERATURE_HOME)s/logs/worker-extract.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
