name: Public code validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --extra dev --extra literature
      - run: uv run python scripts/verify_repository_files.py
      - run: uv run pytest -q --junitxml=portable-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-python-results-${{ matrix.os }}
          path: portable-tests.xml
  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/run-portable-tests.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-dist
          path: frontend/explorer/dist
