name: Public code validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q --junitxml=portable-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-python-results
          path: portable-tests.xml
  explorer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: for test in scripts/test-*.mjs; do node "$test"; done
      - uses: actions/upload-artifact@v4
        with:
          name: explorer-dist
          path: frontend/explorer/dist
